# Build the Docusaurus website and publish it to GitHub Pages.
#
# Locales:
#   Default = 中文 (zh-CN), second = English (en). fr/pt-BR/ko are dropped.
#   GitHub Pages has a HARD 1 GB cap; zh-CN + en stays well under it. The default
#   locale and the built locale list live in docusaurus.config.ts
#   (defaultLocale / production locales). DOCUSAURUS_LOCALES mirrors that subset.
#
# /api/* endpoints (health/storage/feedback) were Cloudflare-Worker-only (D1+KV)
# and DO NOT exist on static Pages. The static build never contained them, so
# nothing breaks, but those AJAX endpoints are simply unavailable here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deploy; a newer push cancels the in-flight one.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max_old_space_size=8192
      # Build only zh-CN + en (must match docusaurus.config.ts production locales).
      DOCUSAURUS_LOCALES: zh-CN,en
      # SITE_URL is resolved automatically by the "Resolve site URL" step below:
      # if a custom domain is bound on Pages it is used, otherwise the project URL.
      # No manual edit needed when you bind/unbind a domain.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # postinstall runs "pnpm build:packages" (lerna), which the website build needs.
        run: pnpm install --frozen-lockfile

      - name: Resolve site URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CNAME=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // empty' 2>/dev/null || true)
          if [ -n "$CNAME" ]; then
            echo "SITE_URL=https://${CNAME}" >> "$GITHUB_ENV"
            echo "Resolved SITE_URL=https://${CNAME} (custom domain)"
          else
            echo "SITE_URL=https://lc-org-cn.github.io" >> "$GITHUB_ENV"
            echo "Resolved SITE_URL=https://lc-org-cn.github.io (project URL, no custom domain yet)"
          fi

      - name: Build website
        run: pnpm build:website

      - name: Disable Jekyll
        # Pages serves via GitHub Actions; add .nojekyll so asset dirs starting
        # with _ (e.g. __docusaurus) are not stripped by Jekyll.
        run: touch website/build/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
